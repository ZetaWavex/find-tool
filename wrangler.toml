name = "find-phone-relay"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# 自定义域名（可选，在 Cloudflare Dashboard 中配置）
# routes = [
#   { pattern = "find.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# KV 命名空间绑定
# 在 Cloudflare Dashboard → Workers → KV 中创建命名空间
# 然后填入 id
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

# 环境变量（建议在 GitHub Secrets 或 Cloudflare Dashboard 中设置敏感值）
[vars]
AUTH_TOKEN = "change-this-to-your-secret-token"
