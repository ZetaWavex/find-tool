name = "find-tool"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# KV存储，项目实际使用
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

# 环境变量，AUTH_TOKEN 修改为你自己的密钥
[vars]
AUTH_TOKEN = "change-this-to-your-secret-token"

# 自定义域名，需要时打开注释修改
# routes = [
#   { pattern = "find.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]
