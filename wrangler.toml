# Worker 基础配置（只写一次，不要重复）
name = "find-tool"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# Durable Object 正确绑定格式
[[durable_objects.bindings]]
name = "PHONE_ROOM"
class_name = "PhoneRoom"

# DO 迁移配置，移除非法字段
[[migrations]]
tag = "v1"
new_classes = ["PhoneRoom"]

# KV 存储（按需启用）
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

# 环境变量
[vars]
AUTH_TOKEN = "change-this-to-your-secret-token"

# 自定义域名路由（按需取消注释）
# routes = [
